# Builds the site, runs every test, and publishes it to GitHub Pages.
# Runs on each change to the main branch, once a week (so dates such as the
# security.txt expiry stay fresh), and on demand from the Actions tab.
name: Build and publish

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 3 * * 1" # Mondays 03:17 UTC
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never run two deployments at once; let a running one finish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Get the code
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Read GitHub Pages settings
        id: pages
        uses: actions/configure-pages@v6

      - name: Install exact dependency versions
        run: npm ci

      - name: Build the site
        run: npm run build
        env:
          # Empty with a custom domain; "/repo-name" on username.github.io/repo-name.
          BASE_PATH: ${{ steps.pages.outputs.base_path }}

      - name: Run all tests
        run: npm test

      - name: Package the site
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist
          # Keep .well-known/security.txt and .nojekyll in the published site.
          include-hidden-files: true

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
