id: password-managers
title: Password managers and two-step login
description: Keep every login for your product, domain, bank and app stores safe, shareable with a co-founder, and recoverable if you lose your phone.
order: 30
stage: 2
intro: |
  Your product is only as safe as the weakest login that controls it: the registrar, the DNS, the email inbox, the hosting and the payment account. Put every one of them in a password manager and turn on two-step login. The [Accounts and ownership checklist](/setup/accounts-and-ownership/) walks through it.
tools:
  - id: bitwarden
    name: Bitwarden
    url: https://bitwarden.com/
    summary: Open-source password manager with a capable free plan, apps on every platform, and secure sharing on paid plans.
    best_for: Anyone starting out. The free plan is enough for one founder.
    pick: true
    pricing:
      model: freemium
      note: Free for individuals with unlimited passwords and devices. Paid plans add sharing, file attachments and 2FA codes.
      url: https://bitwarden.com/pricing/
    checked: 2026-10
    open_source: true
    pros:
      - Unlimited passwords and devices on the free plan.
      - Open source and independently audited.
      - Browser extensions fill logins for you.
    cons:
      - The interface is plainer than paid rivals.
      - Sharing with a co-founder needs a paid organisation plan.
  - id: onepassword
    name: 1Password
    url: https://1password.com/
    summary: Polished paid password manager with strong sharing for teams and families.
    best_for: Small teams that share many logins and want the smoothest experience.
    pricing:
      model: paid
      note: Monthly or yearly per user, with a free trial. Business plans add admin controls.
      url: https://1password.com/pricing
    checked: 2026-10
    pros:
      - Very smooth apps and browser autofill.
      - Clear shared vaults for a team.
      - Watchtower flags weak and reused passwords.
    cons:
      - No free plan.
  - id: ente-auth
    name: Ente Auth
    url: https://ente.io/auth/
    summary: Free, open-source app for two-step login codes, with an encrypted backup so a lost phone does not lock you out.
    best_for: Storing 2FA codes for GitHub, your registrar and your hosting with a safe backup.
    pricing:
      model: free
      note: Free, including encrypted sync across devices.
      url: https://ente.io/auth/
    checked: 2026-10
    open_source: true
    pros:
      - End-to-end encrypted backup of your codes.
      - Works on phone and desktop.
    cons:
      - One more app to install; some password managers can hold codes instead.
